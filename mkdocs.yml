# The documentation site, Hacker's Ham Shack (D-065). Built from docs/ by
# `mkdocs build --strict`; tests/test_site.py builds it on every test run and
# .github/workflows/pages.yml publishes it from main.
#
# MkDocs 1.6.1 and Material 9.7.7 are pinned exactly in pyproject.toml. MkDocs
# 2.0 removes the plugin and theme systems this file relies on, and Material
# enters maintenance mode on 2026-11-05; its authors' successor, Zensical,
# reads this same file. D-065 records the measurement and the migration.

site_name: Hammunition
site_description: >-
  Hacker's Ham Shack: turn an existing Debian-family install into an amateur
  radio, SDR and RF workstation, and learn to use what it installs.
site_url: https://renegade-penguin.github.io/Hammunition/
repo_url: https://github.com/Renegade-Penguin/Hammunition
repo_name: Renegade-Penguin/Hammunition
# No "edit this page" button: half the site is generated, and an edit to a
# generated page is reverted by its generator (tests/test_docs_generated.py).
edit_uri: ""
copyright: >-
  Copyright © 2026 Renegade Penguin LLC. Engine and docs GPL-3.0-or-later;
  catalog CC0-1.0. The software it installs belongs to its authors.

docs_dir: docs
site_dir: site
strict: true

# CLAUDE.md: the project records are not part of the user-facing site. They
# stay in the repository; scripts/site_hooks.py points links to them at GitHub.
exclude_docs: |
  /DECISIONS.md
  /DESIGN.md
  /PARITY-POLICY.md
  /why-hammunition.md
  /QUESTIONS.md
  /SCOPE.md
  /SESSION-LOG.md
  /superpowers/

hooks:
  - scripts/site_hooks.py

validation:
  # Package pages are reached from the package index, not the nav, so MkDocs'
  # own list of pages outside the nav is 266 lines of noise on every build.
  # tests/test_site.py does this check properly: every page is in the nav or
  # is a package page, and it fails naming any that is neither.
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  # No web fonts: Material fetches Google Fonts unless this is false, and the
  # documentation tarball (release.yml) must read with no network. The system's
  # own fonts are used; tests/test_site.py holds this.
  font: false
  # The compass-rose mark from brand/ (docs/contributing/branding.md);
  # tests/test_brand.py asserts these two files are byte-identical to brand/'s.
  logo: images/mark.svg
  favicon: images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys

plugins:
  - search

