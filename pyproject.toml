[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hammunition"
version = "0.22.0"
description = "Turn a Debian-family install into an amateur radio, SDR and RF workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

# The console script. `hammunition` is the binary name (CLAUDE.md).
[project.scripts]
hammunition = "hammunition.cli.main:main"
# The privileged half, reached through one polkit action (D-056). Separate
# from `hammunition` so the thing pkexec is pointed at is three verbs over
# sysfs, not the whole engine with its installer, its network fetches and its
# station config.
hammunition-devctl = "hammunition.cli.devctl:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    # Pinned exactly: `ruff format --check` is a CI gate, and ruff's formatter
    # evolves between releases, so an unpinned floor let CI drift red against
    # code no one had touched. Pin the version the repo is formatted with; bump
    # it deliberately and reformat in the same commit. (CLAUDE.md: a check must
    # be reproducible, or it is a check nobody trusts.)
    "ruff==0.16.5",
    "types-PyYAML",
    # The documentation site (D-065). Pinned exactly, like ruff: the site is
    # built with --strict in tests/test_site.py and by the Pages workflow, and
    # MkDocs 2.0 removes the plugin and theme systems mkdocs.yml relies on.
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    # The console's tests run inside this suite, so its extra is part of dev.
    "urwid>=2.6",
]
# `hammunition console` (the terminal front end, D-059 amended 2026-10-04).
# urwid is the whole dependency; Debian-family machines can take the archive's
# python3-urwid instead, which a virtualenv does not see.
console = [
    "urwid>=2.6",
]
# Just what the Pages workflow needs to build the site.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561. `[tool.mypy] files` analyses src, tests and scripts together, so this
# is not what keeps the repo's own checking honest. It is for everyone else: an
# installed copy without the marker is unfollowable, and a downstream consumer
# type-checking against our manifest classes silently gets `Any` for all of them.
# The catalog is meant to be usable by an engine that is not ours; that is worth
# one empty file.
[tool.setuptools.package-data]
hammunition = ["py.typed", "map_style/LICENSE.openinframap"]

# ---------------------------------------------------------------------------
# mypy --strict is a hard gate, not an aspiration (CLAUDE.md Conventions).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# urwid is treated as untyped, on purpose. Versions 2.6 (Debian's python3-urwid)
# to 4.x are all supported at runtime, and 3.x/4.x ship types 2.6 lacks: checking
# against whichever is installed would make the gate depend on the machine
# (CLAUDE.md: test the matrix, not your machine). Every widget subclasses an urwid
# class, so the base is Any, which is not a defect in this code; and the
# Any-from-unfollowed-import check cannot hold for a package whose whole job is
# drawing with that library. The console package itself stays --strict otherwise.
[[tool.mypy.overrides]]
module = ["urwid", "urwid.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hammunition.console", "hammunition.console.*", "console", "console.*"]
disallow_subclassing_any = false
disallow_any_unimported = false

# The console's tests poke at private widget state and urwid internals, whose
# types differ between urwid versions; an ignore needed on one is unused on the
# other, so unused-ignore warnings are off for them only.
[[tool.mypy.overrides]]
module = ["console", "console.*"]
warn_unused_ignores = false

# The repeaterbook-client unit's own venv carries these, never the engine's
# (src/hammunition/repeaterbook_runner.py runs under that venv's python, D-081).
[[tool.mypy.overrides]]
module = ["anyio.*", "loguru.*", "pycountry.*", "repeaterbook.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
[tool.ruff]
# Design specs and implementation plans quote code from other repositories as
# illustrations; ruff format must not reflow them.
extend-exclude = ["docs/superpowers"]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any is occasionally correct at boundaries
    "E501",    # line length handled by formatter
]

# `described()` is `dataclasses.field(metadata=...)` under a name (D-059); tell
# RUF009 so, rather than silencing it per line.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["hammunition.interface.envelope.described"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]  # fixtures are inferred

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["pty: drives the console inside a real pseudo-terminal (tests/console)"]
