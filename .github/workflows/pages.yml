# Publishes the documentation site, Hacker's Ham Shack, from main (D-065).
# A caller of GYST's docs-pages.yml: it builds with the same --strict build
# tests/test_site.py runs on every pull request, and deploys only from main.
#
# The site is https://renegade-penguin.github.io/Hammunition/. It needs one setting
# the repository owner makes once: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". Until then the deploy job fails with a message
# naming that setting, and nothing else in CI is affected.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/docs-pages.yml@6f40107c2e05483f485452991e422f7f63886000 # v1.25.1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      install-command: pip install --require-hashes -r requirements/docs.txt && pip install --no-deps -e .
      build-command: mkdocs build --strict
