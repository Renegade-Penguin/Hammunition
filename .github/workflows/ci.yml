name: CI

on:
  schedule:
    # Weekly. D-024's cadence is measured in months; this only has to be
    # frequent enough that an overdue pin is noticed within a week of going so.
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # The generic legs live in ChiefGyk3D/git-your-ship-together (GYST): ruff,
  # ruff format, mypy --strict, the pytest matrix and actionlint/zizmor over
  # this directory. Its `CI green` job is the one check that stands for all of
  # them (`ci / CI green`); docs/contributing/ci.md lists it with the local
  # jobs below, which stay here because they are this engine's own.
  #
  # The pytest matrix needs no network except for one `git clone` of the
  # tether (scripts/ci-test.sh), so egress is `block` on GYST's measured list.
  # -------------------------------------------------------------------------
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@faba0b7d1ab65e9033bef1acfa93d6d57b5808c0 # v1.21.0
    permissions:
      contents: read
      # python-ci's coverage job declares id-token: write (Codecov and Doppler
      # OIDC). GitHub validates a called workflow's declared permissions at
      # startup, before any `if`, so a caller that grants less fails the whole
      # file with "Invalid workflow file" and no check appears. No Doppler or
      # Codecov is configured here; the grant only satisfies the declaration.
      id-token: write
    with:
      # 3.14 is what Ubuntu 26.04 -- a supported target -- ships (3.14.4,
      # measured on its VM 2026-09-02, suite green). Test the matrix, not the
      # dev machine.
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      install-command: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      # The tether contract test reads hammunition-gps-tether's source (#215);
      # the script checks it out at the tag the catalog pins, then runs pytest.
      test-command: bash scripts/ci-test.sh
      # CLAUDE.md: Python 3.11+. Lint and types run on the floor.
      lint-python-version: "3.11"
      lint-install-command: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      lint-command: ruff check . && ruff format --check .
      typecheck-install-command: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      typecheck-command: mypy --strict
      # No image of its own; the per-distribution containers are the targets job.
      docker-build: false
      workflow-lint: true
      egress-policy: block

  # -------------------------------------------------------------------------
  # Atheris targets under fuzz/ (the parsers: manifests, repeater imports,
  # grid squares, gpsd JSON, os-release, station config), run by GYST's
  # python-fuzz.yml. 30 s per target on a pull request; the weekly `schedule`
  # trigger above runs 600 s. A crash fails the job and uploads the input
  # that caused it (docs/contributing/ci.md, "Fuzzing"). A local job, not
  # behind `ci / CI green`: that gate is inside the called python-ci.yml.
  # -------------------------------------------------------------------------
  fuzz:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-fuzz.yml@faba0b7d1ab65e9033bef1acfa93d6d57b5808c0 # v1.21.0
    permissions:
      contents: read
    with:
      seconds-per-target: ${{ github.event_name == 'schedule' && 600 || 30 }}

  # -------------------------------------------------------------------------
  # D-031. A commit message that describes a change the commit does not contain
  # is how the D-028 amendment shipped as a no-op. The hook is opt-in locally
  # (git will not run hooks from a clone, by design); this is the enforcement.
  # -------------------------------------------------------------------------
  commit-claims:
    name: commit claims
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # A change to src/, catalog/ or docs/guides/ carries a changelog.d/
      # fragment (D-031's neighbour: the test, not a script, holds the rule).
      # Here, with the history, an unfetched base fails instead of skipping.
      - name: A fragment for a change that needs one
        env:
          BASE: ${{ github.base_ref }}
        run: |
          pip install --require-hashes -r requirements/dev.txt
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          # --noconftest: the check is stdlib-only; conftest imports the engine.
          HAMMUNITION_REQUIRE_PR_RANGE=1 python -m pytest tests/test_changelog.py -q \
            -p no:cacheprovider --noconftest
      - name: Every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"
          fail=0
          for rev in $(git rev-list "$base..$head"); do
            echo "--- $(git log -1 --format='%h %s' "$rev")"
            python3 scripts/check_commit_claims.py --rev "$rev" || fail=1
          done
          exit $fail

  # -------------------------------------------------------------------------
  # One container per target distro. Capability-matrix claims must be backed
  # by a passing container run (CLAUDE.md), never asserted from a dev machine.
  # -------------------------------------------------------------------------
  targets:
    name: ${{ matrix.target.name }}
    # The arm64 target names its own runner; everything else takes the default.
    runs-on: ${{ matrix.target.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: parrot,        image: "parrotsec/core:latest@sha256:97f64574565cc2cd7dfe1e3128ab6ad4131cd745cfba5fbd4bc28421a9827e9d",        platform: linux/amd64 }
          - { name: debian-13,     image: "debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c",                    platform: linux/amd64 }
          - { name: ubuntu-26.04,  image: "ubuntu:26.04@sha256:3595d7fc4286a33fad0fd853a4063e654287a9c3787437d7937c94ca3f7a804e",                 platform: linux/amd64 }
          # The LTS that Mint 22.x and Pop!_OS 24.04 install from; declared
          # 2026-09-03 from the VM campaign, kept alongside 26.04 (targets.yaml).
          - { name: ubuntu-24.04,  image: "ubuntu:24.04@sha256:a853f94d226358a79c740cfc7bce0c289748f3fe3488d921d038ccd752c61b60",                 platform: linux/amd64 }
          - { name: kali-rolling,  image: "kalilinux/kali-rolling:latest@sha256:d1d7e581ed60b0bbf9cb8a4bc853526355978f3b943d3a1d7dc7ce209e4231b6", platform: linux/amd64 }
          # Mint's image ships Ubuntu's base-files; identity_package installs
          # Mint's own from its own repo so os-release reads linuxmint (Q-014).
          - { name: linuxmint-22.3, image: "linuxmintd/mint22.3-amd64:latest@sha256:304bbf7ec2a61252962c5210467d231a141661490e8962f52fd4df7688370369", platform: linux/amd64, identity_package: "base-files/zena" }
          # NOT Raspberry Pi OS — exercises aarch64 selectors only (Q-003).
          # Runs natively on GitHub's hosted arm64 runner (ubuntu-24.04-arm,
          # free for public repositories; Podman 4.9.3 on its image, verified
          # against actions/runner-images 2026-09-12). Under QEMU user-mode
          # emulation on an x64 runner this job took 13-16 min against 1 min
          # for every amd64 target, every run.
          - { name: debian-13-arm64, image: "debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c",                    platform: linux/arm64, runner: ubuntu-24.04-arm }
    # The matrix is this file's own literal, but values reach the shell as
    # environment variables all the same, as GYST's callers do.
    env:
      TARGET: ${{ matrix.target.name }}
      IMAGE: ${{ matrix.target.image }}
      PLATFORM: ${{ matrix.target.platform }}
      IDENTITY_PACKAGE: ${{ matrix.target.identity_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rootless Podman, not Docker. Docker group membership is
      # root-equivalent host access; a security-adjacent project should not
      # require it to run its own CI. See containers/targets.yaml. No QEMU:
      # the one foreign-architecture target runs on a runner of that
      # architecture (above), so every build here is native.

      - name: Build target container
        run: |
          podman build --platform="$PLATFORM" \
            -f containers/Dockerfile.target \
            --build-arg BASE="$IMAGE" \
            --build-arg IDENTITY_PACKAGE="$IDENTITY_PACKAGE" \
            -t "hammunition-$TARGET:ci" .

      - name: Validate catalog against this target
        run: |
          podman run --rm "hammunition-$TARGET:ci" \
            python scripts/capability_matrix.py --check

      - name: Run the test suite inside the target
        # The offline source-build and vendor-.deb sandboxes (#381) run real
        # bwrap, which needs to create its own nested user namespace.
        # seccomp=unconfined alone measured insufficient (2026-10-10), and so
        # did adding --cap-add=SYS_ADMIN on top of it: both left the same
        # "no working bwrap sandbox" failure. Ubuntu 24.04 (this runner's own
        # OS) restricts unprivileged user-namespace creation through AppArmor
        # by default, independently of seccomp and capabilities -- the third
        # mechanism, measured next. Nothing else about the container's
        # confinement (the read-only build it runs inside bwrap, network)
        # changes, and the capability-matrix and mypy steps below keep every
        # default -- only the step that actually exercises bwrap needs any
        # of this.
        run: |
          podman run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --cap-add=SYS_ADMIN "hammunition-$TARGET:ci" python -m pytest

      - name: mypy --strict on the target's own Python
        run: |
          podman run --rm "hammunition-$TARGET:ci" mypy --strict

  # -------------------------------------------------------------------------
  # Documentation is a deliverable; broken internal links fail the build.
  # -------------------------------------------------------------------------
  docs:
    name: docs links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/check_doc_links.py

  # -------------------------------------------------------------------------
  # Provenance: third-party reference material must never reach the repo.
  # -------------------------------------------------------------------------
  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      # Runs before the tests so its report is the first thing in the log: it
      # names the offending rule and line, which a pytest assertion cannot.
      - run: python scripts/audit_gitignore.py
      - run: pytest tests/test_repo_hygiene.py tests/test_gitignore_audit.py

  # -------------------------------------------------------------------------
  # A pin a pull request changes is checked in that pull request.  D-024.
  #
  # The weekly job below still checks all of them, but a wrong or unfetchable
  # ref merged on a Wednesday is an install that fails for every user until the
  # next Monday (librevna, nrsc5 and pihpsdr, 2026-10-02, were reported by the
  # weekly job after v0.19.0 shipped). Only the manifests the diff touched are
  # fetched, so this costs seconds and needs the network for this job alone.
  # -------------------------------------------------------------------------
  changed-pins:
    name: changed git pins resolve upstream
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      - name: Verify the git refs of changed manifests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Added, modified or renamed manifests only; a deleted one has
          # nothing left to resolve.
          mapfile -t changed < <(git diff --name-only --diff-filter=AMR "$BASE...$HEAD" -- 'catalog/packages/*.yaml')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "no package manifest changed"
          else
            python scripts/check_pin_reviews.py --verify-refs --only "${changed[@]}"
          fi

  # -------------------------------------------------------------------------
  # Commit pins go stale on a calendar, not on a commit.  D-024.
  #
  # Whether a pin is well-formed is a property of the code and is asserted in
  # tests, which run on every push. Whether it is STALE is a property of the
  # date, and failing an unrelated pull request because a review date rolled
  # over would teach people to ignore the job -- which is the one outcome that
  # makes the whole mechanism worthless. So this runs on a schedule.
  # -------------------------------------------------------------------------
  pin-reviews:
    name: commit pin reviews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      # --verify-refs fetches each ref from its upstream, which needs the
      # network. That is fine on a scheduled job and is why this check lives
      # here rather than in the test suite, which blocks the network on
      # purpose. It catches a ref that no longer resolves -- a deleted or
      # re-cut tag, or a wrong SHA, which is still 40 hex characters and so
      # passes every offline check there is.
      - run: python scripts/check_pin_reviews.py --verify-refs
      # The Geofabrik sha256 pins: HEAD each pinned URL and compare its size.
      # Geofabrik keeps about three monthly snapshots, so a monthly pin ages
      # out on the calendar and this goes red naming it and the command to
      # regenerate. HEAD only; the ~10 GB regeneration runs on a maintainer's
      # machine.
      - run: python scripts/gen_geofabrik_pins.py --check
      # The Copernicus tile list and tile pins (D-061): diff the carried list
      # against the bucket's and HEAD every pinned tile. HEAD and a 1.1 MB
      # list only; growing the pins downloads 39 MB a tile and runs on a
      # maintainer's machine.
      - run: python scripts/gen_copernicus_pins.py --check
      # The US Topo quad index (D-068): list the bucket's GeoTIFF prefix and
      # fail naming each carried quad that is gone or whose size or ETag
      # changed, since that breaks an install. A newer edition is counted, not
      # failed. A listing only (about 273 pages); nothing is downloaded.
      - run: python scripts/gen_ustopo_index.py --check
      # The 3DEP 1/3-arc-second tile list (D-068, amended 2026-10-01): list the
      # bucket's current/ prefix (six pages) and fail naming each carried tile
      # that is gone or whose size or ETag changed. Nothing is downloaded.
      - run: python scripts/gen_3dep_tiles.py --check
      # The FSTopo quad index (D-068, amended 2026-10-01): the GTAC index layer
      # again (about 19 pages), failing naming each carried quad that is gone
      # or whose box changed. No sheet is downloaded; the pins are grown by
      # hand with --pin, which does download.
      - run: python scripts/gen_fstopo_index.py --check
      # The Kiwix book pins (D-066): each pinned file's .meta4 again, about
      # 5 KB a book. Kiwix keeps two dated files per book, so a pin goes about
      # two publications after it is made and this goes red naming it and the
      # regeneration (scripts/gen_kiwix_pins.py, a 20 MB index and the .meta4s).
      - run: python scripts/gen_kiwix_pins.py --check
      # The region -> country table the Navit converter merges borders by
      # (D-057 amendment). Geofabrik adds and re-parents regions; a region
      # with no row converts with no border and its towns land under
      # "Unknown". Fetches the 0.5 MB index and compares the regions only:
      # the `measured` date moves on every fetch and is not compared.
      - run: python scripts/gen_geofabrik_countries.py --fetch --check
      # CoMaps' map pins (D-069): fetch the ~360 KB index at the commit
      # comaps.yaml pins, compare, and HEAD the pinned World.mwm. The CDN
      # keeps a map version for months, and a mirror answers a missing file
      # with 200 and a web page, so the size is compared, never the status.
      - run: python scripts/gen_comaps_pins.py --check
      # The Open Repeater pin (D-074): fetch its one CC0 file (~241 kB) and
      # compare with the sha256 in catalog/packages/open-repeater.yaml. The
      # URL is not dated, so the pin dies whenever the site's data changes;
      # this goes red naming the generator, and regenerating is running it.
      - run: python scripts/gen_open-repeater-pin.py --check
      # The D-075 infrastructure pins. FAA NASR: fetch the pinned cycle's
      # 8 MB APT zip again and compare (the FAA answered a HEAD with 503),
      # red when a newer 28-day cycle has taken effect. EIA-860M: HEADs, red
      # when a newer month is out or the pinned month moved to EIA's archive
      # (`--follow-move` keeps the pin there). WRI: a HEAD whose ETag must
      # stay the publisher's MD5 recorded in the manifest.
      - run: python scripts/gen_nasr_pin.py --check
      - run: python scripts/gen_eia860m_pin.py --check
      - run: python scripts/gen_wri_pin.py --check

  # -------------------------------------------------------------------------
  # D-031. Every identifier citing a distribution's udev rule is checked
  # against that rule. This needs the archive-wide sweep -- 280 packages and
  # ~264 MB of downloads -- so it cannot run on every push, and the sweep
  # output is gitignored measurement that a fresh clone does not have. Weekly,
  # which is often enough to catch a citation that a Debian upload invalidated
  # and cheap enough that nobody learns to ignore it.
  # -------------------------------------------------------------------------
  rule-citations:
    name: udev rule citations
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      - name: Sweep every udev rule in the archive
        # The same runner a developer uses, so the mounts the sweep needs
        # (the script and its parser module) live in one place. A hand-written
        # podman line here fell behind when the parser became a module and the
        # job died on import, unnoticed because only the schedule runs it.
        run: scripts/run-udev-sweep.sh debian-13
      - run: python scripts/check_rule_citations.py
