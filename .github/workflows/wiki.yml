# Publishes the GitHub wiki from docs/ on every push to main.
# A caller of GYST's wiki-publish.yml.
#
# The wiki is a generated mirror of the MkDocs site (scripts/gen_wiki.py), never
# a place to write: the publish replaces every page in it. The canonical site is
# https://renegade-penguin.github.io/Hammunition/ (pages.yml).
#
# It needs one thing the repository owner does once: a wiki git remote does not
# exist until the first page is created in the GitHub UI. Until then the publish
# job fails with a message naming that step, and nothing else in CI is affected.

name: Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/wiki-publish.yml@faba0b7d1ab65e9033bef1acfa93d6d57b5808c0 # v1.21.0
    permissions:
      contents: write
    with:
      install-command: pip install --require-hashes -r requirements/docs.txt && pip install --no-deps -e .
      generate-command: python scripts/gen_wiki.py --out wiki-out --commit "$GITHUB_SHA"
      out-dir: wiki-out
